services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/enprove.db
    volumes:
      - api-data:/app/data
    ports:
      - "8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:8000
    ports:
      - "3200:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  api-data:
